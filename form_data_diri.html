<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Formulir Data Diri</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background: #fff;
            width: 100%;
            max-width: 480px;
            padding: 25px 30px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
        }
        .group {
            margin-bottom: 15px;
        }
        .label-judul {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }
        input[type="text"],
        input[type="date"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .hobi-list label {
            display: block;
            margin-bottom: 5px;
            cursor: pointer;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Formulir Data Diri</h2>
    <form action="proses_data_diri.php" method="POST">
        <div class="group">
            <label for="nama" class="label-judul">Nama Lengkap:</label>
            <input type="text" id="nama" name="nama" required>
        </div>

        <div class="group">
            <label for="tgl_lahir" class="label-judul">Tanggal Lahir:</label>
            <input type="date" id="tgl_lahir" name="tgl_lahir" required>
        </div>

        <div class="group hobi-list">
            <label class="label-judul">Hobi:</label>
            <label><input type="checkbox" name="hobi[]" value="Membaca"> Membaca</label>
            <label><input type="checkbox" name="hobi[]" value="Olahraga"> Olahraga</label>
            <label><input type="checkbox" name="hobi[]" value="Musik"> Musik</label>
            <label><input type="checkbox" name="hobi[]" value="Lainnya"> Lainnya</label>
        </div>

        <button type="submit">Kirim</button>
    </form>
</div>

</body>
</html>
